name: Deploy (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

env:
  DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

jobs:
  validate-deploy-config:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FRONTEND_URL BACKEND_URL)
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret in GitHub Environment '${{ env.DEPLOY_ENVIRONMENT }}': ${key}"
              exit 1
            fi
          done
          echo "All required deployment secrets are present."

  pre-deploy-checks:
    runs-on: ubuntu-latest
    needs: [validate-deploy-config]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install JS deps
        run: npm ci
      - name: Frontend lint
        run: npm run lint:web
      - name: Frontend typecheck
        run: npm run typecheck:web
      - name: Frontend build
        run: npm run build:web
      - name: Worker typecheck
        run: npm run typecheck -w @aequitas/api-worker
      - name: Worker tests
        run: npm run test -w @aequitas/api-worker
      - name: AI golden intent eval gate
        run: npm run eval:golden
      - name: Backend tests and FastAPI import
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt
          pytest apps/server/tests -q --tb=line
          python -c "from app.main import app; print('FastAPI app import ok:', app.title)"

  deploy-backend-worker:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Deploy Cloudflare Worker API
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPSTREAM_API_BASE: ${{ secrets.UPSTREAM_API_BASE }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Production uses the default worker (aequitas-api) — no named env in wrangler.jsonc.
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi

  pages-deploy-mode:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Emit Pages deploy summary
        run: |
          {
            echo "## Cloudflare Pages deploy mode"
            echo "- Frontend is deployed by Cloudflare Pages Git integration (not this job)."
            echo "- Pages project root: \`apps/web\`"
            echo "- Build command: \`npm ci && npm run build -w @aequitas/web\`"
            echo "- Branch mapping: \`main\` -> production, \`develop\` -> preview"
            echo "- Ensure Pages env vars match: \`NEXT_PUBLIC_AEQUITAS_API_URL\`, Supabase keys"
            echo "- If Git Provider shows **No**, connect the repo in the Cloudflare dashboard before relying on frontend deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-check:
    runs-on: ubuntu-latest
    needs: [deploy-backend-worker, pages-deploy-mode]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Deployment smoke checks
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: npm run deploy:smoke
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-artifacts
          path: artifacts/deploy-smoke
          if-no-files-found: warn

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: [deploy-backend-worker, pages-deploy-mode, smoke-check]
    if: ${{ always() && (needs.deploy-backend-worker.result == 'failure' || needs.smoke-check.result == 'failure') }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Rollback Worker to previous version
        if: needs.deploy-backend-worker.result == 'failure' || needs.smoke-check.result == 'failure'
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler rollback --yes || echo "::warning::Automatic Worker rollback failed; use Cloudflare dashboard."
          else
            npx wrangler rollback --yes --env preview || echo "::warning::Automatic Worker rollback failed; use Cloudflare dashboard."
          fi

      - name: Emit rollback summary
        if: always()
        run: |
          {
            echo "## Deployment failure handling"
            echo "- Frontend rollback: Cloudflare Pages -> Deployments -> redeploy previous build."
            echo "- Backend rollback: attempted via \`wrangler rollback\` (see job logs)."
            echo "- Smoke artifacts: \`deploy-smoke-artifacts\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
