name: Deploy (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

jobs:
  validate-deploy-config:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FRONTEND_URL BACKEND_URL)
          missing=0
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  pre-deploy-checks:
    runs-on: ubuntu-latest
    needs: [validate-deploy-config]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JS deps
        run: npm ci
      - name: Frontend lint
        run: npm run lint:web
      - name: Frontend typecheck
        run: npm run typecheck:web
      - name: Frontend build
        run: npm run build:web
      - name: Worker typecheck
        run: npm run typecheck -w @aequitas/api-worker
      - name: Worker tests
        run: npm run test -w @aequitas/api-worker
      - name: AI golden intent eval gate
        run: npm run eval:golden
      - name: Backend tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt
          pytest apps/server/tests -q --tb=line

  deploy-backend-worker:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Deploy Cloudflare Worker API
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPSTREAM_API_BASE: ${{ secrets.UPSTREAM_API_BASE }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Production is the default worker (aequitas-api); wrangler.jsonc has no "production" env.
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi

  pages-deploy-mode:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Emit Pages deploy summary
        run: |
          {
            echo "## Cloudflare Pages deploy mode"
            echo "- Frontend deploys automatically via Cloudflare Pages Git integration."
            echo "- Branch mapping: main -> production, develop -> preview."
            echo "- This workflow validates quality gates before merge and deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-check:
    runs-on: ubuntu-latest
    needs: [deploy-backend-worker, pages-deploy-mode]
    if: ${{ needs.deploy-backend-worker.result == 'success' && needs.pages-deploy-mode.result == 'success' }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Deployment smoke checks
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: npm run deploy:smoke
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-artifacts
          path: artifacts/deploy-smoke
          if-no-files-found: warn

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: [deploy-backend-worker, pages-deploy-mode, smoke-check]
    if: ${{ always() && (needs.deploy-backend-worker.result == 'failure' || needs.pages-deploy-mode.result == 'failure' || needs.smoke-check.result == 'failure') }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci

      # Smoke failed after a successful deploy: a new (bad) version is live — rollback is correct.
      - name: Rollback Worker after failed smoke checks
        if: needs.deploy-backend-worker.result == 'success' && needs.smoke-check.result == 'failure'
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler rollback --yes
          else
            npx wrangler rollback --yes --env preview
          fi

      # Deploy failed: no new version was activated — do not rollback (would downgrade a healthy release).
      - name: Deploy failure guidance (no Worker rollback)
        if: needs.deploy-backend-worker.result == 'failure'
        run: |
          echo "::warning::Worker deploy failed; the currently live version was not replaced."
          echo "Do not run wrangler rollback — that would activate an older version while production is still healthy."

      - name: Emit failure handling summary
        if: always()
        run: |
          {
            echo "## Deployment failure handling"
            if [ "${{ needs.deploy-backend-worker.result }}" = "success" ] && [ "${{ needs.smoke-check.result }}" = "failure" ]; then
              echo "- Backend: attempted \`wrangler rollback\` because deploy succeeded but smoke checks failed."
            elif [ "${{ needs.deploy-backend-worker.result }}" = "failure" ]; then
              echo "- Backend: deploy failed — previous Worker version remains live; rollback was **not** run."
            fi
            echo "- Frontend rollback: Cloudflare Pages -> Deployments -> redeploy previous build."
            echo "- Diagnostics: \`deploy-smoke-artifacts\` workflow artifact and Cloudflare dashboards."
          } >> "$GITHUB_STEP_SUMMARY"
